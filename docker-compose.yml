services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - parry-demo-redis:/data

  demo-api:
    build:
      context: .
      dockerfile: docker/demo-api/Dockerfile
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: '3000'
      REDIS_URL: redis://redis:6379
      PARRY_STORE: redis
      PARRY_ADMIN_ENABLED: 'true'
      PARRY_ADMIN_AUTH_MODE: token
      PARRY_ADMIN_TOKEN: ${PARRY_ADMIN_TOKEN:-change-me}
      DEMO_USER_EMAIL: demo@example.com
      DEMO_USER_PASSWORD: password123
    depends_on:
      redis:
        condition: service_healthy

volumes:
  parry-demo-redis:
