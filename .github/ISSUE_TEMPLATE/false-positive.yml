name: False positive
description: Report benign input that a Parry detector blocks.
title: '[False positive]: '
labels: [false-positive]
body:
  - type: input
    id: version
    attributes:
      label: Parry version
      placeholder: 2.0.0
    validations:
      required: true
  - type: dropdown
    id: detector
    attributes:
      label: Detector
      options:
        - SQL injection
        - XSS
        - NoSQL injection
        - HPP
        - Prototype pollution
        - Path traversal
        - Request shape
        - Unknown
    validations:
      required: true
  - type: textarea
    id: input
    attributes:
      label: Minimal benign input and target field
      description: Use synthetic data only and explain why it is expected application traffic.
    validations:
      required: true
  - type: textarea
    id: finding
    attributes:
      label: Sanitized finding or response
      render: json
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Relevant configuration
      render: javascript
