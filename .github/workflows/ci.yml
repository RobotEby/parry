name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18.x, 20.x, 22.x, 24.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

  quality:
    name: Quality, package, and security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Test TypeScript declarations
        run: npm run test:types

      - name: Validate fixtures
        run: npm run test:fixtures

      - name: Run payload regression
        run: npm run test:payload-regression

      - name: Validate package allowlist and tarball
        run: npm run package:check

      - name: npm pack dry-run
        run: npm run package:dry-run

      - name: Audit runtime dependencies
        run: npm audit --omit=dev

      - name: Security sanity checks
        shell: bash
        run: |
          set -euo pipefail

          tracked_env="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -vE '\.example$' || true)"
          if [ -n "$tracked_env" ]; then
            echo "Tracked .env-style files are not allowed:"
            echo "$tracked_env"
            exit 1
          fi

          tracked_tfvars="$(git ls-files | grep -E '(^|/)[^/]+\.tfvars$' | grep -vE '\.tfvars\.example$' || true)"
          if [ -n "$tracked_tfvars" ]; then
            echo "Tracked real Terraform tfvars files are not allowed:"
            echo "$tracked_tfvars"
            exit 1
          fi

          if git grep -n -E '(AWS_SECRET_ACCESS_KEY|aws_secret_access_key)[[:space:]]*=[[:space:]]*[^[:space:]]{20,}|AKIA[0-9A-Z]{16}' -- ':!package-lock.json' ':!docker/demo-api/package-lock.json'; then
            echo "Potential static AWS credential detected."
            exit 1
          fi
