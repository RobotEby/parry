name: npm Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm-publish:
    name: Validate and publish package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          scope: '@roboteby'

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: |
          npm run lint
          npm run format:check
          npm test
          npm run test:types
          npm run test:fixtures
          npm run test:payload-regression
          npm run package:check
          npm run package:dry-run

      - name: Validate release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: npm run package:check-tag

      - name: Select npm dist-tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          dist_tag="latest"

          case "$version" in
            *-alpha.*) dist_tag="alpha" ;;
            *-beta.*) dist_tag="beta" ;;
            *-rc.*) dist_tag="rc" ;;
            *-next.*) dist_tag="next" ;;
          esac

          echo "NPM_DIST_TAG=$dist_tag" >> "$GITHUB_ENV"

      - name: Publish with npm Trusted Publishing
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: npm publish --access public --tag "$NPM_DIST_TAG" --provenance
