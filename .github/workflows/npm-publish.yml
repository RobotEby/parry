name: npm Publish

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish'
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  npm-publish:
    name: Validate and publish package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/v{0}', inputs.version) || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          registry-url: 'https://registry.npmjs.org'
          scope: '@roboteby'

      - name: Install dependencies
        run: npm ci

      - name: Run release checks
        run: |
          npm run lint
          npm run format:check
          npm test
          npm run test:types
          npm run test:fixtures
          npm run test:payload-regression
          npm run package:check
          npm run package:dry-run

      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(node -p "require('./package.json').version")"

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            requested_version="${{ inputs.version }}"
            expected_tag="v${requested_version}"

            if [[ "$package_version" != "$requested_version" ]]; then
              echo "package.json version '$package_version' does not match requested version '$requested_version'."
              exit 1
            fi

            actual_tag="$(git describe --tags --exact-match HEAD 2>/dev/null || true)"

            if [[ "$actual_tag" != "$expected_tag" ]]; then
              echo "Checked-out tag '$actual_tag' does not match expected tag '$expected_tag'."
              exit 1
            fi
          else
            npm run package:check-tag
          fi

      - name: Select npm dist-tag
        shell: bash
        run: |
          set -euo pipefail

          version="$(node -p "require('./package.json').version")"
          dist_tag="latest"

          case "$version" in
            *-alpha.*) dist_tag="alpha" ;;
            *-beta.*) dist_tag="beta" ;;
            *-rc.*) dist_tag="rc" ;;
            *-next.*) dist_tag="next" ;;
          esac

          echo "NPM_DIST_TAG=$dist_tag" >> "$GITHUB_ENV"
          echo "Publishing version $version with npm dist-tag $dist_tag"

      - name: Verify npm authentication
        run: npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish package
        run: npm publish --access public --tag "$NPM_DIST_TAG" --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
